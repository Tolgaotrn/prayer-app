name: iOS Production Build & Submit

on:
  workflow_dispatch:

jobs:
  build-and-submit:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS (local)
        run: eas build --local --platform ios --profile production --non-interactive --output ./build.ipa
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Write App Store Connect API key
        run: echo "${{ secrets.ASC_API_KEY_BASE64 }}" | base64 --decode > ./asc-api-key.p8

      - name: Submit to App Store Connect
        run: eas submit --platform ios --path ./build.ipa --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-ipa
          path: ./build.ipa
          retention-days: 3
