name: Check Xcode versions

on:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Runner + Xcode info
        run: |
          echo "=== Runner: ${{ matrix.runner }} ==="
          echo "macOS: $(sw_vers -productVersion)"
          echo "--- Installed Xcodes ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "none"
          echo "--- Default xcodebuild ---"
          xcodebuild -version
          echo "--- SDKs ---"
          xcodebuild -showsdks 2>/dev/null | grep -i ios || true
